name: Publish Trading Journal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          test -f index.html
          test -f config.js
          mkdir -p _site
          cp ./*.html ./*.js ./*.css ./*.svg _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
